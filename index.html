<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فصول السنة الأربعة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05080f;color:#f3ead8;font-family:"Cairo",Tahoma,Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px 12px 150px;min-height:100vh;min-height:100dvh}
#stage{
  width:min(calc(100vw - 24px), calc((100vh - 290px) * 9 / 16));
  width:min(calc(100vw - 24px), calc((100dvh - 290px) * 9 / 16));
  aspect-ratio:9/16;
  border-radius:16px;overflow:hidden;background:#000;
  box-shadow:0 24px 70px rgba(0,0,0,.6);
}
canvas{display:block;width:100%;height:100%}
#ui{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;width:min(calc(100vw - 24px),560px)}
button{font:inherit;font-weight:700;font-size:15px;background:#f3ead8;color:#0b1220;border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.4;cursor:default}
#seek{flex:1 1 180px;accent-color:#ffd27a;min-width:120px}
#time{font-variant-numeric:tabular-nums;font-size:14px;min-width:96px;text-align:center;direction:ltr}
#hint{margin:0;font-size:13px;opacity:.75;text-align:center;width:min(calc(100vw - 24px),560px)}
#dock{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:14px 12px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(rgba(5,8,15,0),#05080f 40%);
}
#export{
  font:inherit;font-weight:900;font-size:19px;color:#0b1220;
  background:#ffd27a;border:0;border-radius:999px;
  padding:15px 30px;min-width:min(86vw,320px);cursor:pointer;
  box-shadow:0 10px 28px rgba(255,210,122,.4);touch-action:manipulation;
}
#export:active{transform:scale(.98)}
#export:disabled{opacity:.45;cursor:default;box-shadow:none}
#status{font-size:15px;text-align:center;min-height:1em}
#status:empty{display:none}
#dl{
  display:inline-block;background:#7fe3a0;color:#05200f;text-decoration:none;
  font-weight:800;padding:12px 20px;border-radius:999px;
}
button:disabled{opacity:.4}
</style>
</head>
<body>
<div id="stage"><canvas id="scene" width="1080" height="1920"></canvas></div>
<div id="ui">
  <button id="play" type="button">▶ تشغيل</button>
  <button id="restart" type="button">↺ من البداية</button>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="شريط التقدم">
  <span id="time">0:00 / 0:35</span>
</div>
<p id="hint">مسافة: تشغيل/إيقاف · المدة 35 ثانية · بصيغة 9:16 للجوال</p>

<div id="dock">
  <div id="status" role="status" aria-live="polite"></div>
  <button id="export" type="button">⏺ تصدير الفيديو</button>
</div>

<script>
(() => {
"use strict";

/* ================= الإعدادات والأدوات ================= */
const W = 1080, H = 1920, TAU = Math.PI * 2;
const cv = document.getElementById("scene");
const g = cv.getContext("2d");

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, s, d) => clamp((t - s) / d);
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOutBack = t => { t = clamp(t); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };

// مولّد أرقام عشوائية ثابت (حتى تكون المشاهد متطابقة في كل تشغيل)
function rng(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// مزج لونين بالسِّت عشري
function mix(c1, c2, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  const A = p(c1), B = p(c2);
  return "rgb(" + A.map((v, i) => Math.round(lerp(v, B[i], clamp(t)))).join(",") + ")";
}
// جسيمات بحركة تعتمد على الزمن فقط (تعمل بشكل صحيح مع التقديم والتمرير)
function parts(seed, n, o) {
  const r = rng(seed);
  return Array.from({ length: n }, () => ({
    x0: r(), y0: r(), sp: lerp(o.sp[0], o.sp[1], r()), ph: r() * TAU,
    am: o.am * (.5 + r()), sz: lerp(o.sz[0], o.sz[1], r()),
    rot: r() * TAU, rs: (r() - .5) * 3,
    c: o.c[Math.floor(r() * o.c.length)], a: .6 + r() * .4, f: !!o.flake
  }));
}
function fall(p, lt) {
  const yy = ((p.y0 + lt * p.sp) % 1 + 1) % 1;
  return {
    x: (((p.x0 + Math.sin(lt * .8 + p.ph) * p.am) % 1) + 1) % 1 * W,
    y: (-.05 + yy * 1.1) * H
  };
}

/* ================= عناصر الرسم ================= */
function txt(s, x, y, font, color, alpha = 1, shadow = null) {
  g.save();
  g.globalAlpha = alpha; g.font = font; g.fillStyle = color;
  g.textAlign = "center"; g.textBaseline = "middle";
  if (shadow) { g.shadowColor = shadow; g.shadowBlur = 28; g.shadowOffsetY = 6; }
  g.fillText(s, x, y);
  g.restore();
}
function sky(stops) {
  const gr = g.createLinearGradient(0, 0, 0, H);
  for (const [o, c] of stops) gr.addColorStop(o, c);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
function sun(x, y, r, halo = "rgba(255,236,170,.9)", core = "#fff6c2", a = 1) {
  g.save();
  g.globalAlpha = a;
  const gr = g.createRadialGradient(x, y, r * .6, x, y, r * 3.4);
  gr.addColorStop(0, halo);
  gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr;
  g.beginPath(); g.arc(x, y, r * 3.4, 0, TAU); g.fill();
  g.fillStyle = core;
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  g.restore();
}
function cloud(x, y, s, a = .85) {
  g.save();
  g.globalAlpha = a; g.fillStyle = "#ffffff";
  g.beginPath();
  g.arc(x, y, 44 * s, 0, TAU);
  g.arc(x + 48 * s, y - 20 * s, 58 * s, 0, TAU);
  g.arc(x + 102 * s, y, 42 * s, 0, TAU);
  g.arc(x + 52 * s, y + 10 * s, 50 * s, 0, TAU);
  g.fill();
  g.restore();
}
function drift(i, lt, spd, y, s, a) {
  const x = ((i * .31 + lt * spd) % 1.4) * (W + 500) - 250;
  cloud(x, y, s, a);
}
// تلّ موجي
function hill(y0, amp, freq, ph, col, lt = 0, spd = 0) {
  g.fillStyle = col;
  g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W; x += 12) {
    const y = y0 + Math.sin(x * freq + ph + lt * spd) * amp + Math.sin(x * freq * 2.1 + ph * 2) * amp * .3;
    g.lineTo(x, y);
  }
  g.lineTo(W, H); g.closePath(); g.fill();
}
// شجرة صنوبر
function pine(x, y, h, col) {
  g.fillStyle = col;
  for (let j = 0; j < 3; j++) {
    const top = y - h + j * h * .3, bot = top + h * .55, w = h * (.32 - j * .06);
    g.beginPath(); g.moveTo(x, top); g.lineTo(x + w, bot); g.lineTo(x - w, bot); g.closePath(); g.fill();
  }
  g.fillRect(x - h * .04, y - h * .08, h * .08, h * .1);
}
// ورقة
function leaf(x, y, s, rot, col, a = 1) {
  g.save();
  g.translate(x, y); g.rotate(rot); g.globalAlpha = a; g.fillStyle = col;
  g.beginPath();
  g.moveTo(0, -s);
  g.quadraticCurveTo(s * .85, -s * .35, 0, s);
  g.quadraticCurveTo(-s * .85, -s * .35, 0, -s);
  g.fill();
  g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = Math.max(1, s * .08);
  g.beginPath(); g.moveTo(0, -s * .9); g.lineTo(0, s * .8); g.stroke();
  g.restore();
}
// بتلة زهرة / ورقة ساقطة
function petal(q, p, lt) {
  g.save();
  g.translate(q.x, q.y); g.rotate(p.rot + lt * p.rs);
  g.globalAlpha = p.a; g.fillStyle = p.c;
  g.beginPath(); g.ellipse(0, 0, p.sz, p.sz * .55, 0, 0, TAU); g.fill();
  g.restore();
}
// ندفة ثلج بستة أذرع
function flake(x, y, s, rot, a) {
  g.save();
  g.translate(x, y); g.rotate(rot); g.globalAlpha = a;
  g.strokeStyle = "#ffffff"; g.lineWidth = Math.max(1.5, s * .12); g.lineCap = "round";
  for (let i = 0; i < 6; i++) {
    g.rotate(TAU / 6);
    g.beginPath();
    g.moveTo(0, 0); g.lineTo(0, -s);
    g.moveTo(0, -s * .55); g.lineTo(s * .3, -s * .8);
    g.moveTo(0, -s * .55); g.lineTo(-s * .3, -s * .8);
    g.stroke();
  }
  g.restore();
}
// طائر بسيط
function bird(x, y, s, a = .75) {
  g.save();
  g.strokeStyle = "#1d3f57"; g.lineWidth = 3; g.globalAlpha = a; g.lineCap = "round";
  g.beginPath();
  g.moveTo(x - s, y - s * .4);
  g.quadraticCurveTo(x - s * .5, y - s * .9, x, y);
  g.quadraticCurveTo(x + s * .5, y - s * .9, x + s, y - s * .4);
  g.stroke();
  g.restore();
}
// فراشة مع رفرفة
function butterfly(bx, by, s, c, flap) {
  g.save();
  g.translate(bx, by); g.fillStyle = c; g.globalAlpha = .95;
  for (const sd of [-1, 1]) {
    g.save(); g.scale(sd, 1);
    g.beginPath(); g.ellipse(s * .55, -s * .2, s * .55 * flap + 1, s * .45, -.3, 0, TAU); g.fill();
    g.restore();
  }
  g.fillStyle = "#3a2a2a"; g.fillRect(-s * .05, -s * .4, s * .1, s * .9);
  g.restore();
}
// زهرة ربيعية بساق
function flower(f, lt, grow) {
  const sw = Math.sin(lt * 1.1 + f.ph) * f.s * .25;
  const topX = f.x + sw, topY = f.y - f.s * 2.4 * grow;
  g.save();
  g.strokeStyle = "#3f9a4a"; g.lineWidth = 5;
  g.beginPath(); g.moveTo(f.x, H); g.quadraticCurveTo(f.x, (f.y + topY) / 2, topX, topY); g.stroke();
  g.translate(topX, topY); g.rotate(sw * .02);
  for (let i = 0; i < 5; i++) {
    g.rotate(TAU / 5);
    g.fillStyle = f.c;
    g.beginPath(); g.ellipse(0, -f.s * .45 * grow, f.s * .32 * grow, f.s * .46 * grow, 0, 0, TAU); g.fill();
  }
  g.fillStyle = "#ffd54a";
  g.beginPath(); g.arc(0, 0, f.s * .22 * grow, 0, TAU); g.fill();
  g.restore();
}
// شجرة بفروع مُنشأة مسبقاً (ثابتة البنية) مع إزهار وتمايل
function makeTree(seed, x, y, len, depth) {
  const r = rng(seed), segs = [], tips = [];
  (function grow(x0, y0, l, a, d, w) {
    const x1 = x0 + Math.cos(a) * l, y1 = y0 + Math.sin(a) * l;
    segs.push({ x1: x0, y1: y0, x2: x1, y2: y1, w });
    if (d === 0) {
      for (let i = 0; i < 4; i++) tips.push({ x: x1 + (r() - .5) * 150, y: y1 + (r() - .5) * 110, s: 22 + r() * 18, k: r() });
      return;
    }
    const n = d > 2 ? 3 : 2;
    for (let i = 0; i < n; i++)
      grow(x1, y1, l * (.68 + r() * .12), a + (i - (n - 1) / 2) * (.45 + r() * .35) + (r() - .5) * .25, d - 1, w * .7);
  })(x, y, len, -Math.PI / 2, depth, depth * 4 + 6);
  return { segs, tips, base: { x, y }, ph: r() * TAU };
}
function drawTree(tr, lt, bloom, trunk, cols, size = 1) {
  g.save();
  const b = tr.base;
  g.translate(b.x, b.y); g.rotate(Math.sin(lt * .8 + tr.ph) * .012); g.translate(-b.x, -b.y);
  g.strokeStyle = trunk; g.lineCap = "round";
  for (const s of tr.segs) {
    g.lineWidth = s.w;
    g.beginPath(); g.moveTo(s.x1, s.y1); g.lineTo(s.x2, s.y2); g.stroke();
  }
  if (bloom > 0) tr.tips.forEach((p, i) => {
    const q = clamp(bloom * 1.6 - p.k * .6);
    if (q <= 0) return;
    const r = p.s * size * easeOut(q);
    g.globalAlpha = q; g.fillStyle = cols[i % cols.length];
    g.beginPath();
    g.arc(p.x, p.y, r, 0, TAU);
    g.arc(p.x + r * .8, p.y - r * .2, r * .8, 0, TAU);
    g.arc(p.x - r * .7, p.y - r * .3, r * .75, 0, TAU);
    g.fill();
  });
  g.restore();
}
// مظلة شاطئ
function umbrella(x, y, r) {
  g.save();
  g.strokeStyle = "#ffffff"; g.lineWidth = 7;
  g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 200); g.stroke();
  for (let i = 0; i < 6; i++) {
    g.fillStyle = i % 2 ? "#ffffff" : "#ff5d73";
    g.beginPath(); g.moveTo(x, y);
    g.arc(x, y, r, Math.PI + i * Math.PI / 6, Math.PI + (i + 1) * Math.PI / 6);
    g.closePath(); g.fill();
  }
  g.restore();
}
// نقاط مؤشّر الفصل
function dots(idx, a) {
  for (let i = 0; i < 4; i++) {
    const x = W / 2 + (i - 1.5) * 46, y = H - 86, on = i === idx;
    g.save();
    g.globalAlpha = a * (on ? 1 : .5);
    g.fillStyle = on ? "#ffd27a" : "#ffffff";
    g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 2;
    g.beginPath(); g.arc(x, y, on ? 11 : 8, 0, TAU); g.fill(); g.stroke();
    g.restore();
  }
}
// تدرّج داكن للإضاءة والوضوح
function vignette() {
  const gr = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .78);
  gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,.4)");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const top = g.createLinearGradient(0, 0, 0, H * .42);
  top.addColorStop(0, "rgba(0,0,0,.28)"); top.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = top; g.fillRect(0, 0, W, H * .42);
}
// عنوان الفصل مع حركة دخول سينمائية
function seasonTitle(lt, n, title, sub, color, shadow) {
  const a = easeOut(prog(lt, .25, 1)), y = lerp(40, 0, a);
  txt("الفصل " + ["١", "٢", "٣", "٤"][n - 1], W / 2, 330 + y, "700 40px Cairo", "#ffe7a3", a, "rgba(0,0,0,.45)");
  const lw = 220 * easeOut(prog(lt, .7, 1.1));
  g.save(); g.globalAlpha = a; g.fillStyle = "#ffd27a";
  g.fillRect(W / 2 - lw / 2, 380 + y, lw, 4); g.restore();
  const b = easeOut(prog(lt, .9, 1.1));
  g.save();
  g.translate(W / 2, 500 + lerp(50, 0, b));
  const sc = lerp(1.25, 1, easeOutBack(prog(lt, .9, 1.1)));
  g.scale(sc, sc);
  txt(title, 0, 0, "900 180px Cairo", color, b, shadow);
  g.restore();
  const c = easeOut(prog(lt, 1.5, 1.2));
  txt(sub, W / 2, 650 + lerp(30, 0, c), "400 46px Cairo", "#ffffff", c, "rgba(0,0,0,.4)");
}

/* ================= بيانات المشاهد (ثابتة) ================= */
const ICONS = [["spring", "الربيع", "#ff9dc3"], ["summer", "الصيف", "#ffd54a"], ["autumn", "الخريف", "#f3872a"], ["winter", "الشتاء", "#bfe6ff"]];

// أيقونات الفصول
function icon(type, x, y, s) {
  g.save(); g.translate(x, y);
  if (type === "spring") {
    for (let i = 0; i < 5; i++) {
      g.rotate(TAU / 5); g.fillStyle = "#ffc2d9";
      g.beginPath(); g.ellipse(0, -s * .5, s * .3, s * .48, 0, 0, TAU); g.fill();
    }
    g.fillStyle = "#ffd54a"; g.beginPath(); g.arc(0, 0, s * .22, 0, TAU); g.fill();
  } else if (type === "summer") {
    g.fillStyle = "#ffd54a"; g.beginPath(); g.arc(0, 0, s * .5, 0, TAU); g.fill();
    g.strokeStyle = "#ffd54a"; g.lineWidth = s * .12; g.lineCap = "round";
    for (let i = 0; i < 8; i++) {
      g.rotate(TAU / 8);
      g.beginPath(); g.moveTo(0, -s * .7); g.lineTo(0, -s * .95); g.stroke();
    }
  } else if (type === "autumn") {
    g.rotate(-.5); g.fillStyle = "#f3872a";
    g.beginPath(); g.moveTo(0, -s); g.quadraticCurveTo(s * .9, -s * .3, 0, s * .9); g.quadraticCurveTo(-s * .9, -s * .3, 0, -s); g.fill();
    g.strokeStyle = "#8a3d12"; g.lineWidth = s * .08;
    g.beginPath(); g.moveTo(0, -s * .9); g.lineTo(0, s * 1.1); g.stroke();
  } else {
    g.strokeStyle = "#e8f6ff"; g.lineWidth = s * .12; g.lineCap = "round";
    for (let i = 0; i < 6; i++) {
      g.rotate(TAU / 6);
      g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -s);
      g.moveTo(0, -s * .55); g.lineTo(s * .3, -s * .8);
      g.moveTo(0, -s * .55); g.lineTo(-s * .3, -s * .8);
      g.stroke();
    }
  }
  g.restore();
}

const IN_STARS = (() => { const r = rng(7); return Array.from({ length: 150 }, () => ({ x: r() * W, y: r() * H * .6, s: .8 + r() * 2.2, p: r() * TAU, sp: .6 + r() * 1.8 })); })();

// الربيع
const SP_TREES = [makeTree(11, W * .16, H * .8, 150, 4), makeTree(12, W * .9, H * .82, 165, 4)];
const SP_FLOWERS = (() => { const r = rng(21); return Array.from({ length: 16 }, (_, i) => ({ x: W * (i / 15) + (r() - .5) * 70, y: H * (.86 + r() * .1), s: 30 + r() * 24, ph: r() * TAU, c: ["#ff8fb1", "#ffd1e0", "#fff2a0", "#ffffff"][i % 4] })); })();
const SP_PETALS = parts(31, 80, { sp: [.035, .06], am: .03, sz: [7, 13], c: ["#ffc2d9", "#ff9cc0", "#ffffff"] });
const SP_FLY = [{ ph: 0, c: "#ffb347" }, { ph: 2.4, c: "#ff7eb3" }, { ph: 4.1, c: "#9fd8ff" }];

// الصيف
const SU_BIRDS = Array.from({ length: 6 }, (_, i) => ({ o: i * .21, y: .3 + (i % 3) * .035, s: 16 + (i % 2) * 8 }));
const SU_SPARK = (() => { const r = rng(44); return Array.from({ length: 40 }, () => ({ x: r(), y: H * (.64 + r() * .14), p: r() * TAU, sp: 1 + r() * 2, s: 2 + r() * 3 })); })();

// الخريف
const AU_TREES = [makeTree(31, W * .1, H * .8, 150, 4), makeTree(32, W * .5, H * .84, 175, 4), makeTree(33, W * .92, H * .8, 150, 4)];
const AU_LEAVES = parts(41, 70, { sp: [.03, .05], am: .04, sz: [12, 22], c: ["#e4572e", "#f3a712", "#c1440e", "#ffb703", "#d9622b"] });

// الشتاء
const WI_STARS = (() => { const r = rng(55); return Array.from({ length: 70 }, () => ({ x: r() * W, y: r() * H * .45, s: .8 + r() * 2, p: r() * TAU, sp: .8 + r() * 2 })); })();
const WI_BACK = (() => { const r = rng(61); return Array.from({ length: 8 }, (_, i) => ({ x: W * (i / 7) + (r() - .5) * 80, y: H * .72 + (r() - .5) * 30, h: 110 + r() * 60, c: "#3b6b78" })); })();
const WI_FRONT = (() => { const r = rng(62); return Array.from({ length: 4 }, (_, i) => ({ x: W * (.08 + i * .3) + (r() - .5) * 60, y: H * .93 + r() * 20, h: 260 + r() * 70, c: "#183a44" })); })();
const WI_SNOW = [

];

// الإطار الافتتاحي والختامي
function drawIntro(lt) {
  const k = easeIO(prog(lt, 0, 4.2));
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, mix("#06101f", "#3a86c4", k));
  gr.addColorStop(.6, mix("#121a3a", "#ffb98a", k));
  gr.addColorStop(1, mix("#0a0c18", "#ffe6b8", k));
  g.fillStyle = gr; g.fillRect(0, 0, W, H);

  IN_STARS.forEach(s => {
    g.globalAlpha = (.4 + .6 * Math.sin(lt * s.sp + s.p)) * (1 - k);
    g.fillStyle = "#fff"; g.beginPath(); g.arc(s.x, s.y, s.s, 0, TAU); g.fill();
  });
  g.globalAlpha = 1;

  sun(W / 2, lerp(H * 1.05, H * .5, easeOut(prog(lt, .2, 4.2))), 150, "rgba(255,220,150,.9)", "#fff1c4", 1);
  hill(H * .8, 30, .0035, 0, mix("#1b2a4a", "#2d5a58", k), lt, .03);
  hill(H * .88, 22, .005, 2, mix("#0c1424", "#1f4a3c", k), lt, 0);

  const a = easeOut(prog(lt, 1.3, 1.1));
  txt("فصول السنة", W / 2, H * .2 + lerp(40, 0, a), "900 120px Cairo", "#ffffff", a, "rgba(0,0,0,.4)");

  txt("الأربعة", W / 2, H * .2 + 150 + lerp(40, 0, b), "900 150px Cairo", "#ffd27a", b, "rgba(0,0,0,.4)");

  ICONS.forEach((ic, i) => {
    const x = W * (.2 + i * .2), c = easeOut(prog(lt, 2.8 + i * .25, .9));
    if (c <= 0) return;
    g.save(); g.globalAlpha = c;
    g.translate(x, H * .66); g.scale(lerp(.6, 1, c), lerp(.6, 1, c));
    icon(ic[0], 0, 0, 64);
    g.restore();
    txt(ic[1], x, H * .66 + 130 + lerp(20, 0, c), "700 40px Cairo", "#ffffff", c, "rgba(0,0,0,.4)");
  });
}

function drawOutro(lt) {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, "#0b1430"); gr.addColorStop(1, "#2a2046");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);

    g.fillStyle = "#fff"; g.beginPath(); g.arc(s.x, s.y, s.s, 0, TAU); g.fill();

  g.beginPath(); g.arc(0, 0, W * .38, 0, TAU); g.stroke();

  txt("فصول السنة الأربعة", W / 2, H * .2, "900 96px Cairo", "#ffffff", easeOut(prog(lt, .2, 1)), "rgba(0,0,0,.4)");

    const c = easeOut(prog(lt, .4 + i * .3, 1));

    g.save(); g.globalAlpha = c;
    g.translate(x, y); g.scale(lerp(.5, 1, c) * pulse, lerp(.5, 1, c) * pulse);

}

  for (let i = 0; i < 18; i++) {

  g.save(); g.strokeStyle = "rgba(255,255,255,.45)"; g.lineWidth = 3; g.lineCap = "round";
  for (let i = 0; i < 12; i++) {
    const y = H * .64 + i * H * .014;
    for (let k = 0; k < 5; k++) {

}

/* ================= الجدول الزمني والانتقالات ================= */
const SCENES = [
  { dur: 5, draw: drawIntro },
  { dur: 8, draw: drawSpring },
  { dur: 8, draw: drawSummer },
  { dur: 8, draw: drawAutumn },
  { dur: 8, draw: drawWinter },
  { dur: 8.5, draw: drawOutro }
];
const TR = 1.4; // مدة الانتقال بين المشاهد
{
  let acc = 0;
  SCENES.forEach((s, i) => { s.start = acc; acc += s.dur - (i < SCENES.length - 1 ? TR : 0); });
}
const TOTAL = SCENES[SCENES.length - 1].start + SCENES[SCENES.length - 1].dur;

// رسم مشهد مع حركة كاميرا بطيئة (Ken Burns)
function renderScene(k, lt) {
  const S = SCENES[k], z = 1 + .05 * clamp(lt / S.dur);
  g.save();
  g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-W / 2, -H / 2);
  S.draw(lt);
  g.restore();
}

function renderAt(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);

  let k = 0;
  SCENES.forEach((s, i) => { if (t >= s.start) k = i; });
  const S = SCENES[k];

  if (k > 0 && t < S.start + TR) {
    // انتقال دائري (Iris) يكشف المشهد الجديد مع وهج على الحافة
    const p = clamp((t - S.start) / TR), P = SCENES[k - 1];
    renderScene(k - 1, t - P.start);
    const cx = W / 2, cy = H * .5, R = Math.max(.01, Math.hypot(W, H) * .62 * easeIO(p));
    g.save();
    g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.clip();
    renderScene(k, t - S.start);
    g.restore();
    g.save();
    g.globalCompositeOperation = "lighter";
    g.strokeStyle = `rgba(255,220,160,${.9 * Math.sin(p * Math.PI)})`;
    g.lineWidth = 14; g.shadowColor = "#ffd27a"; g.shadowBlur = 50;
    g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.stroke();
    g.restore();
  } else {
    renderScene(k, t - S.start);
  }
  overlayFx(t, k);
}

// تأثيرات فوق الإطار: وميض عند الانتقال، وشريط تقدم ذهبي أسفل الفيديو
function overlayFx(t, k) {
  if (k > 0 && t < SCENES[k].start + TR) {
    const p = clamp((t - SCENES[k].start) / TR);
    g.save();
    g.globalCompositeOperation = "lighter";
    g.globalAlpha = .35 * Math.sin(p * Math.PI);
    g.fillStyle = "#fff2cc";
    g.fillRect(0, 0, W, H);
    g.restore();
  }
  g.save();
  g.fillStyle = "rgba(255,255,255,.2)"; g.fillRect(0, H - 8, W, 8);
  g.fillStyle = "#ffd27a"; g.fillRect(0, H - 8, W * clamp(t / TOTAL), 8);
  g.restore();
}

/* ================= التشغيل والواجهة ================= */
const $ = id => document.getElementById(id);
const playBtn = $("play"), restartBtn = $("restart"), seek = $("seek");
const timeEl = $("time"), exportBtn = $("export"), statusEl = $("status");

let t = 0, playing = false, last = performance.now();
let recorder = null;

// التعليق الصوتي: يُشغَّل مع الحركة ويُمزج داخل الفيديو المُصدَّر
const audio = new Audio("narration.mp3");
audio.preload = "auto";
audio.onerror = () => {};

function setPlaying(v) {
  playing = v;
  if (v) {
    try { audio.currentTime = t; } catch (e) {}
    audio.play().catch(() => {});
  } else {
    audio.pause();
  }
}

// بدء من وقت محدد عبر الرابط: index.html#t=12
const hm = location.hash.match(/t=([\d.]+)/);
if (hm) t = clamp(parseFloat(hm[1]), 0, TOTAL);

const fmt = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

function updateUI() {
  if (document.activeElement !== seek) seek.value = Math.round(t / TOTAL * 1000);
  timeEl.textContent = fmt(t) + " / " + fmt(TOTAL);
  playBtn.textContent = playing ? "⏸ إيقاف" : "▶ تشغيل";
  if (recording) statusEl.textContent = "جارٍ التسجيل… " + fmt(t) + " / " + fmt(TOTAL);
}

function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000);
  last = now;
  if (playing) {
    t += dt;
    // تصحيح الانحراف بين الصوت والصورة
    if (!audio.paused && Math.abs(audio.currentTime - t) > .3) {
      try { audio.currentTime = t; } catch (e) {}
    }
    if (t >= TOTAL) {
      t = TOTAL;
      setPlaying(false);
      if (recorder && recorder.state !== "inactive") recorder.stop();
    }
  }
  renderAt(t);
  updateUI();
  requestAnimationFrame(frame);
}

playBtn.onclick = () => { if (t >= TOTAL) t = 0; setPlaying(!playing); };
restartBtn.onclick = () => { t = 0; setPlaying(true); };
seek.oninput = () => { t = seek.value / 1000 * TOTAL; try { audio.currentTime = t; } catch (e) {} };
document.addEventListener("keydown", e => {
  if (e.code === "Space" && e.target.tagName !== "BUTTON") { e.preventDefault(); playBtn.click(); }
});

// ===== تصدير الفيديو: تسجيل الحركة كاملة بالوقت الحقيقي =====
// الأولوية لـ MP4 إن كان المتصفح يدعمه، وإلا WebM
const MIMES = ["video/mp4", "video/webm;codecs=vp9", "video/webm"];
const MIME = window.MediaRecorder ? MIMES.find(m => MediaRecorder.isTypeSupported(m)) : null;
const canRecord = !!(MIME && cv.captureStream);
let recording = false, stopTimer = null, dlUrl = null;

// داخل عارض Claude يُحفظ الملف عبر واجهة التنزيلات؛ في المتصفح العادي يعمل الرابط مباشرة
let downloadsNs = null;
try {
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(ns => { downloadsNs = ns || null; }).catch(() => {});
  }
} catch (e) { /* لا شيء: نستخدم الرابط العادي */ }

function showDone(msg, link) {
  statusEl.textContent = msg;
  statusEl.appendChild(document.createElement("br"));
  statusEl.appendChild(link);
}

function setLocked(on) {
  playBtn.disabled = on; restartBtn.disabled = on; seek.disabled = on;
}

function finishRecording() {
  clearTimeout(stopTimer);
  recording = false;
  setPlaying(false);
  setLocked(false);
  exportBtn.textContent = "⏺ تصدير الفيديو";
  exportBtn.disabled = !canRecord;
}

// مسار صوت للتسجيل: يمرّ الصوت عبر Web Audio إلى MediaStream
let actx = null, mdest = null;
function audioTrack() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const src = actx.createMediaElementSource(audio);
      mdest = actx.createMediaStreamDestination();
      src.connect(mdest);
      src.connect(actx.destination);
    }
    actx.resume();
    return mdest.stream.getAudioTracks()[0] || null;
  } catch (e) {
    return null;
  }
}

function startExport() {
  if (!canRecord || recording) return;
  if (dlUrl) { URL.revokeObjectURL(dlUrl); dlUrl = null; }
  statusEl.textContent = "";

  const type = MIME.split(";")[0];
  const ext = type === "video/mp4" ? "mp4" : "webm";
  const stream = cv.captureStream(30);
  const at = audioTrack();
  if (at) stream.addTrack(at);
  const chunks = [];
  let rec;
  try {
    rec = new MediaRecorder(stream, { mimeType: MIME, videoBitsPerSecond: 8000000 });
  } catch (err) {
    statusEl.textContent = "تعذّر بدء التسجيل على هذا المتصفح";
    return;
  }
  recorder = rec;

  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type });
    dlUrl = URL.createObjectURL(blob);
    const filename = "seasons-9x16." + ext;
    const a = document.createElement("a");
    a.id = "dl";
    a.href = dlUrl;
    a.download = filename;
    a.textContent = "⬇ تنزيل الفيديو (" + ext.toUpperCase() + "، " + (blob.size / 1048576).toFixed(1) + " MB)";
    a.onclick = async e => {
      if (!downloadsNs) return; // المتصفح العادي: تنزيل مباشر من الرابط
      e.preventDefault();
      try {
        await downloadsNs.save({ filename, data: blob });
        showDone("تم حفظ الفيديو", a);
      } catch (err) {
        showDone(err && err.code === "declined" ? "تم إلغاء التنزيل" : "تعذّر التنزيل في هذا العرض", a);
      }
    };
    statusEl.textContent = "";
    statusEl.appendChild(a);
    stream.getTracks().forEach(tr => tr.stop());
    finishRecording();
  };

  t = 0; setPlaying(true);
  recording = true; setLocked(true);
  exportBtn.textContent = "⏹ إيقاف التسجيل";
  rec.start(250);

  // ضمان الإيقاف بعد انتهاء المدة حتى لو تأخرت الإطارات
  stopTimer = setTimeout(() => {
    if (recorder && recorder.state !== "inactive") recorder.stop();
  }, (TOTAL + 2) * 1000);
}

exportBtn.onclick = () => {
  if (recording) { if (recorder.state !== "inactive") recorder.stop(); }
  else startExport();
};
if (!canRecord) {
  exportBtn.disabled = true;
