<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>متجر نورة للتصميم الجرافيكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#071221;color:#f7f3ea;font-family:"Cairo",Tahoma,Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:12px;min-height:100vh;min-height:100dvh}
#stage{
  width:min(calc(100vw - 24px), calc((100vh - 110px) * 9 / 16));
  width:min(calc(100vw - 24px), calc((100dvh - 110px) * 9 / 16));
  aspect-ratio:9/16;border-radius:18px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}
canvas{display:block;width:100%;height:100%}
#go{font:inherit;font-weight:900;font-size:18px;color:#0d1b2a;background:#c9a227;border:0;border-radius:999px;padding:14px 30px;cursor:pointer;touch-action:manipulation}
#go:disabled{opacity:.5;cursor:default}
#note{margin:0;font-size:13px;opacity:.7;text-align:center}
</style>
</head>
<body>
<div id="stage"><canvas id="scene" width="1080" height="1920"></canvas></div>
<button id="go" type="button">▶ تشغيل</button>
<button id="exp" type="button">⏺ تصدير MP4</button>
<p id="note">35 ثانية · ثلاثة مشاهد · الصوت يُشغَّل من narration.mp3 إن وُجد</p>

<script>
(() => {
"use strict";

const W = 1080, H = 1920, TAU = Math.PI * 2, DUR = 35;
const cv = document.getElementById("scene");
const g = cv.getContext("2d");
const btn = document.getElementById("go");
const note = document.getElementById("note");

/* ===== بيانات قابلة للتعديل ===== */
// أضف بيانات التواصل الرسمية هنا؛ الحقول الفارغة لا تظهر في الفيديو
const CONTACT = { phone: "", email: "", site: "" };

const CAP = [
  "في عالم الأعمال اليوم، الهوية البصرية ليست مجرد تصميم.. بل هي الانطباع الأول والرسالة التي تعكس ثقل منطقتك ومكانتك في السوق.",
  "في متجر نورة للتصميم الجرافيكي، نقدم حلولاً بصرية متكاملة للمؤسسات والشركات.. نبتكر لك هوية تجارية تعبر عن رؤيتك الإستراتيجية، بدءاً من صياغة الشعار، ووصولاً إلى الأدلة البصرية والمستندات المؤسسية.",
  "اجعل علامتك التجارية تتحدث بلغة الاحتراف والتميز. تواصل معنا اليوم للاستشارة والبدء في بناء هويتك المؤسسية."
];

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, s, d) => clamp((t - s) / d);
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOutBack = t => { t = clamp(t); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const win = (t, s, e) => clamp(Math.min(prog(t, s, .6), 1 - prog(t, e - .6, .6)));

const NAVY = "#0d1b2a", NAVY2 = "#13294b", GOLD = "#c9a227", GOLD2 = "#f0d68a", CREAM = "#f7f3ea", SLATE = "#8a94a6";

/* ===== عناصر مشتركة ===== */
function bg(lt) {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, NAVY); gr.addColorStop(1, NAVY2);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // خطوط ذهبية خافتة تنساب ببطء
  g.save(); g.strokeStyle = "rgba(201,162,39,.12)"; g.lineWidth = 2;
  for (let i = 0; i < 9; i++) {
    const off = ((i * 260 + lt * 40) % (W + 600)) - 300;
    g.beginPath(); g.moveTo(off, 0); g.lineTo(off + 500, H); g.stroke();
  }
  g.restore();
}
function txt(s, x, y, font, color, a = 1, align = "center") {
  g.save();
  g.globalAlpha = a; g.font = font; g.fillStyle = color;
  g.textAlign = align; g.textBaseline = "middle";
  g.fillText(s, x, y);
  g.restore();
}
// رسم الشعار: حلقة ذهبية تكتمل، ثم حرف "ن" في المنتصف، ونقطة شروق
function mark(x, y, r, p) {
  if (p <= 0) return;
  g.save();
  g.translate(x, y);
  g.lineCap = "round";
  g.strokeStyle = GOLD; g.lineWidth = r * .1;
  const end = -Math.PI / 2 + TAU * .88 * easeOut(p);
  g.beginPath(); g.arc(0, 0, r, -Math.PI / 2, end); g.stroke();
  const dot = easeOut(prog(p, .8, .2));
  if (dot > 0) {
    g.fillStyle = GOLD2;
    g.beginPath(); g.arc(Math.cos(end) * r, Math.sin(end) * r, r * .12 * dot, 0, TAU); g.fill();
  }
  const a = easeOut(prog(p, .55, .45));
  txt("ن", 0, r * .06, `900 ${Math.round(r * 1.25)}px Cairo`, GOLD2, a);
  g.restore();
}
// تفاف النص داخل عرض محدد
function wrap(s, maxW) {
  const words = s.split(" "); const lines = []; let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (g.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
// الشرح السفلي (التعليق) داخل صندوق داكن شفاف
function caption(text, a) {
  if (a <= 0) return;
  g.save();
  g.font = "700 42px Cairo";
  const lines = wrap(text, 860);
  const lh = 62, boxH = lines.length * lh + 46, cy = H * .8;
  g.globalAlpha = a * .75;
  g.fillStyle = "rgba(7,18,33,.85)";
  g.beginPath(); g.roundRect(W / 2 - 480, cy - boxH / 2, 960, boxH, 26); g.fill();
  g.restore();
  lines.forEach((ln, i) => txt(ln, W / 2, cy - (lines.length - 1) * lh / 2 + i * lh, "700 42px Cairo", CREAM, a));
}

/* ===== المشهد 1: الهوية البصرية على التابلت (0 - 7) ===== */
function scene1(lt) {
  const slide = easeOut(prog(lt, 0, 1.2));
  const tw = 640, th = 860, tx = W / 2 - tw / 2, ty = H * .3 - th / 2 + (1 - slide) * 80;
  g.save(); g.globalAlpha = slide;
  // إطار التابلت
  g.fillStyle = "#050d18";
  g.beginPath(); g.roundRect(tx - 24, ty - 24, tw + 48, th + 48, 56); g.fill();
  // الشاشة
  g.fillStyle = CREAM;
  g.beginPath(); g.roundRect(tx, ty, tw, th, 22); g.fill();
  // خطوط الإنشاء والتوجيه
  const gp = easeOut(prog(lt, 1, 1.5));
  g.save(); g.beginPath(); g.rect(tx, ty, tw, th); g.clip();
  g.strokeStyle = "rgba(13,27,42,.18)"; g.lineWidth = 2; g.setLineDash([10, 10]);
  const cx = tx + tw / 2, cy = ty + th * .45;
  g.beginPath();
  g.moveTo(cx, ty + th * .5 - th * .5 * gp); g.lineTo(cx, ty + th * .5 + th * .5 * gp);
  g.moveTo(tx, cy); g.lineTo(tx + tw, cy);
  g.moveTo(tx + tw * .2, ty); g.lineTo(tx + tw * .2, ty + th);
  g.moveTo(tx + tw * .8, ty); g.lineTo(tx + tw * .8, ty + th);
  g.stroke();
  g.setLineDash([]);
  // دائرة الإنشاء
  g.strokeStyle = "rgba(201,162,39,.5)";
  g.beginPath(); g.arc(cx, cy, 170 * gp, 0, TAU); g.stroke();
  g.restore();
  // الشعار يُرسم مع الزمن
  mark(cx, cy, 130, prog(lt, 2.5, 2.5));
  // عنوان صغير على الشاشة
  txt("شعار متجر نورة", cx, ty + th * .82, "700 34px Cairo", NAVY, prog(lt, 4.5, .8));
  g.restore();
}

/* ===== المشهد 2: المستندات والتطبيقات (7 - 22) ===== */
const DOCS = [
  { label: "دليل الهوية", x: .3, y: .42, r: -.12, d: 0 },
  { label: "المستندات الرسمية", x: .7, y: .46, r: .1, d: .9 },
  { label: "العروض التقديمية", x: .5, y: .3, r: 0, d: 1.8, lab: -330 }
];
function docCard(x, y, w, h, rot, a) {
  g.save();
  g.globalAlpha = a;
  g.translate(x, y); g.rotate(rot);
  g.shadowColor = "rgba(0,0,0,.35)"; g.shadowBlur = 40; g.shadowOffsetY = 18;
  g.fillStyle = CREAM;
  g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 18); g.fill();
  g.shadowColor = "transparent";
  // شعار صغير ونصوص وهمية
  mark(-w / 2 + 70, -h / 2 + 80, 34, 1);
  g.fillStyle = "rgba(13,27,42,.12)";
  for (let i = 0; i < 5; i++) g.fillRect(-w / 2 + 40, -h / 2 + 150 + i * 36, w - 80 - (i % 2) * 120, 14);
  g.fillStyle = GOLD;
  g.fillRect(-w / 2 + 40, h / 2 - 80, w * .35, 6);
  g.restore();
}
function scene2(lt) {
  DOCS.forEach((d, i) => {
    const e = easeOutBack(prog(lt, d.d, 1));
    if (e <= 0) return;
    const ang = d.r + Math.sin(lt * .6 + i) * .02;
    const scale = lerp(.6, 1, e);
    g.save();
    g.translate(d.x * W, d.y * H);
    g.scale(scale, scale);
    docCard(0, 0, 400, 540, ang, clamp(e));
    g.restore();
    const la = win(lt, d.d + .8, 99) * clamp(e);
    txt(d.label, d.x * W, d.y * H + (d.lab ?? 330) * scale, "700 40px Cairo", GOLD2, la);
  });
}

/* ===== المشهد 3: الخاتمة (22 - 35) ===== */
function scene3(lt) {
  const cx = W / 2, cy = H * .36;
  const rot = Math.sin(lt * .4) * .03;
  g.save(); g.translate(cx, cy); g.rotate(rot); g.translate(-cx, -cy);
  mark(cx, cy, 170, prog(lt, 0, 2.6));
  // لمعة تمر فوق الشعار
  const sweep = prog(lt, 4.5, 1.2);
  if (sweep > 0 && sweep < 1) {
    const x = lerp(cx - 300, cx + 300, sweep);
    const gr = g.createLinearGradient(x - 60, 0, x + 60, 0);
    gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(.5, "rgba(255,255,255,.35)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.save(); g.globalCompositeOperation = "lighter";
    g.fillStyle = gr; g.fillRect(x - 60, cy - 200, 120, 400);
    g.restore();
  }
  g.restore();
  txt("متجر نورة", W / 2, H * .6, "900 96px Cairo", GOLD2, easeOut(prog(lt, 2.6, 1)));
  txt("للتصميم الجرافيكي", W / 2, H * .67, "600 50px Cairo", CREAM, easeOut(prog(lt, 3.2, 1)));
  // بيانات التواصل (تظهر فقط إن أُضيفت)
  const lines = [];
  if (CONTACT.phone) lines.push(CONTACT.phone);
  if (CONTACT.email) lines.push(CONTACT.email);
  if (CONTACT.site) lines.push(CONTACT.site);
  const ca = easeOut(prog(lt, 27, 1));
  if (lines.length) lines.forEach((ln, i) => txt(ln, W / 2, H * .74 + i * 58, "700 40px Cairo", CREAM, ca));
  else txt("تواصل معنا اليوم", W / 2, H * .74, "700 44px Cairo", GOLD2, ca);
}

/* ===== الرسم ===== */
const SCENES = [
  { s: 0, e: 7, draw: scene1 },
  { s: 7, e: 22, draw: scene2 },
  { s: 22, e: 35, draw: scene3 }
];
function draw(lt) {
  bg(lt);
  let k = 0;
  SCENES.forEach((sc, i) => { if (lt >= sc.s) k = i; });
  const sc = SCENES[k];
  const local = lt - sc.s;
  const fade = prog(lt, sc.s, .6);
  g.save(); g.globalAlpha = fade;
  sc.draw(local);
  g.restore();
  // التعليق يتغير مع كل مشهد
  const capA = clamp(Math.min(prog(lt, sc.s + .4, .6), 1 - prog(lt, sc.e - .5, .5)));
  caption(CAP[k], capA);
  // شريط تقدم ذهبي
  g.save();
  g.fillStyle = "rgba(255,255,255,.12)"; g.fillRect(0, H - 8, W, 8);
  g.fillStyle = GOLD; g.fillRect(0, H - 8, W * clamp(lt / DUR), 8);
  g.restore();
}

/* ===== الصوت والتشغيل ===== */
const narr = new Audio("narration.mp3");
narr.preload = "auto";
narr.onerror = () => {};

let lt = 0, playing = false, p0 = 0;
let recorder = null, actx = null, mdest = null;
const expBtn = document.getElementById("exp");
const MIMES = ["video/mp4", "video/webm;codecs=vp9", "video/webm"];
const MIME = window.MediaRecorder ? MIMES.find(m => MediaRecorder.isTypeSupported(m)) : null;

function loop(now) {
  if (playing) {
    lt = (now - p0) / 1000;
    if (lt >= DUR) {
      lt = DUR; playing = false;
      btn.textContent = "↺ إعادة التشغيل";
      btn.disabled = false;
      if (recorder && recorder.state !== "inactive") recorder.stop();
    }
  }
  draw(clamp(lt, 0, DUR));
  requestAnimationFrame(loop);
}
btn.onclick = () => {
  p0 = performance.now();
  playing = true;
  try { narr.currentTime = 0; narr.play().catch(() => {}); } catch (e) {}
  btn.textContent = "جارٍ التشغيل…";
  btn.disabled = true;
};

// تصدير MP4 (أو WebM إن لم يكن MP4 مدعومًا) مع الصوت إن وُجد
function startExport() {
  if (!MIME || recorder) return;
  const stream = cv.captureStream(30);
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const src = actx.createMediaElementSource(narr);
      mdest = actx.createMediaStreamDestination();
      src.connect(mdest);
      src.connect(actx.destination);
    }
    actx.resume();
    const at = mdest.stream.getAudioTracks()[0];
    if (at) stream.addTrack(at);
  } catch (e) { /* بدون صوت */ }

  const type = MIME.split(";")[0];
  const ext = type === "video/mp4" ? "mp4" : "webm";
  const chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: MIME, videoBitsPerSecond: 8000000, audioBitsPerSecond: 192000 });
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "noura-35s." + ext;
    a.textContent = "⬇ تنزيل الفيديو (" + ext.toUpperCase() + "، " + (blob.size / 1048576).toFixed(1) + " MB)";
    note.textContent = "";
    note.appendChild(a);
    stream.getTracks().forEach(tr => tr.stop());
    recorder = null;
    expBtn.disabled = false;
    btn.disabled = false;
  };
  expBtn.disabled = true; btn.disabled = true;
  note.textContent = "جارٍ تسجيل الفيديو…";
  p0 = performance.now(); playing = true;
  try { narr.currentTime = 0; narr.play().catch(() => {}); } catch (e) {}
  recorder.start(250);
  setTimeout(() => { if (recorder && recorder.state !== "inactive") recorder.stop(); }, (DUR + 2) * 1000);
}
expBtn.onclick = startExport;

draw(0);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
