<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>البشارة - ليان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a1f26;color:#fff8f0;font-family:"Cairo",Tahoma,Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:12px;min-height:100vh;min-height:100dvh}
#stage{
  width:min(calc(100vw - 24px), calc((100vh - 110px) * 9 / 16));
  width:min(calc(100vw - 24px), calc((100dvh - 110px) * 9 / 16));
  aspect-ratio:9/16;border-radius:18px;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}
canvas{display:block;width:100%;height:100%}
#go{font:inherit;font-weight:900;font-size:18px;color:#5a3a2e;background:#f6e3c2;border:0;border-radius:999px;padding:14px 30px;cursor:pointer;touch-action:manipulation}
#go:disabled{opacity:.5;cursor:default}
#note{margin:0;font-size:13px;opacity:.7;text-align:center}
</style>
</head>
<body>
<div id="stage"><canvas id="scene" width="1080" height="1920"></canvas></div>
<button id="go" type="button">▶ شغّل مع الصوت</button>
<button id="exp" type="button">⏺ تصدير MP4</button>
<p id="note">دقيقة كاملة · يحتاج الصوت نقرة واحدة لأن المتصفح يمنع التشغيل التلقائي</p>

<script>
(() => {
"use strict";

const W = 1080, H = 1920, TAU = Math.PI * 2, DUR = 60;
const cv = document.getElementById("scene");
const g = cv.getContext("2d");
const btn = document.getElementById("go");

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, s, d) => clamp((t - s) / d);
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
function rng(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// نافذة زمنية: تظهر بنعومة ثم تتلاشى
const win = (t, s, e) => clamp(Math.min(prog(t, s, .8), 1 - prog(t, e - .7, .7)));

/* ================= المشاهد السبعة (المجموع 60 ثانية) ================= */
const SCENES = [
  { s: 0,    e: 8.5,  chord: [261.63, 329.63, 392.00], chime: true },
  { s: 8.5,  e: 17,   chord: [392.00, 493.88, 587.33], chime: true },
  { s: 17,   e: 25.5, chord: [220.00, 261.63, 329.63], chime: false },
  { s: 25.5, e: 34,   chord: [349.23, 440.00, 523.25], chime: false },
  { s: 34,   e: 42.5, chord: [293.66, 349.23, 440.00], chime: false },
  { s: 42.5, e: 51,   chord: [261.63, 329.63, 392.00], chime: true },
  { s: 51,   e: 60,   chord: [392.00, 493.88, 587.33], chime: true }
];

/* ================= العناصر البصرية ================= */
const R = rng(5);
const BOK = Array.from({ length: 26 }, () => ({
  x: R() * W, y: R() * H, r: 40 + R() * 110, sp: .006 + R() * .018, ph: R() * TAU,
  c: ["255,214,222", "255,236,196", "206,238,222"][Math.floor(R() * 3)]
}));
const HEARTS = Array.from({ length: 11 }, () => ({
  x: R(), sp: .02 + R() * .025, ph: R(), s: 26 + R() * 30, c: ["#f4a7b9", "#f7c3cf", "#e9a0a8"][Math.floor(R() * 3)]
}));
const SPARKS = Array.from({ length: 36 }, () => ({
  x: R(), sp: .04 + R() * .05, ph: R(), s: 3 + R() * 4, tw: R() * TAU
}));
// الزهور تظهر تدريجيًا على امتداد الدقيقة
const FLOWERS = [
  { x: .12, y: .9,  s: 150, c: "#f4b6c2", d: 0 },
  { x: .88, y: .88, s: 170, c: "#f7c9b6", d: 3 },
  { x: .04, y: .42, s: 110, c: "#f9d3dc", d: 12 },
  { x: .96, y: .38, s: 120, c: "#f4b6c2", d: 20 },
  { x: .5,  y: .98, s: 200, c: "#fbdcd0", d: 28 },
  { x: .08, y: .7,  s: 90,  c: "#fbe0c8", d: 38 },
  { x: .92, y: .66, s: 100, c: "#f9d3dc", d: 46 },
  { x: .3,  y: 1.0, s: 130, c: "#f4b6c2", d: 54 }
].map((f, i) => ({ ...f, ph: i * 1.3 }));

function background(lt) {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, "#fbe4e6"); gr.addColorStop(.55, "#ffeedf"); gr.addColorStop(1, "#f3e7d3");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // أشعة ذهبية ناعمة تتحرك ببطء
  g.save(); g.globalCompositeOperation = "lighter";
  for (let i = 0; i < 6; i++) {
    const x = W * (.1 + i * .16) + Math.sin(lt * .3 + i) * 60;
    const gg = g.createLinearGradient(x, 0, x + 200, H);
    gg.addColorStop(0, "rgba(255,226,160,0)");
    gg.addColorStop(.5, "rgba(255,226,160,.12)");
    gg.addColorStop(1, "rgba(255,226,160,0)");
    g.fillStyle = gg;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 200, 0); g.lineTo(x + 420, H); g.lineTo(x + 220, H); g.closePath(); g.fill();
  }
  g.restore();
}
function bokeh(lt) {
  BOK.forEach(b => {
    const y = ((b.y / H - lt * b.sp) % 1 + 1) % 1 * H;
    const x = b.x + Math.sin(lt * .5 + b.ph) * 40;
    const gr = g.createRadialGradient(x, y, 0, x, y, b.r);
    gr.addColorStop(0, `rgba(${b.c},.5)`);
    gr.addColorStop(1, `rgba(${b.c},0)`);
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, b.r, 0, TAU); g.fill();
  });
}
function flower(f, lt) {
  const gw = easeOut(prog(lt, f.d, 2));
  if (gw <= 0) return;
  g.save();
  g.translate(f.x * W, f.y * H);
  g.rotate(Math.sin(lt * .8 + f.ph) * .06);
  g.scale(gw, gw);
  for (let i = 0; i < 6; i++) {
    g.rotate(TAU / 6);
    g.fillStyle = f.c; g.globalAlpha = .9;
    g.beginPath(); g.ellipse(0, -f.s * .5, f.s * .32, f.s * .5, 0, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  g.fillStyle = "#e8c27a";
  g.beginPath(); g.arc(0, 0, f.s * .18, 0, TAU); g.fill();
  g.restore();
}
function heart(x, y, s, a, c) {
  g.save();
  g.globalAlpha = a; g.fillStyle = c;
  g.translate(x, y); g.scale(s / 10, s / 10);
  g.beginPath();
  g.moveTo(0, 3);
  g.bezierCurveTo(-5, -2, -5, -6, 0, -3);
  g.bezierCurveTo(5, -6, 5, -2, 0, 3);
  g.fill();
  g.restore();
}
function hearts(lt) {
  HEARTS.forEach(h => {
    const f = ((lt * h.sp + h.ph) % 1 + 1) % 1;
    const y = H + 60 - f * (H + 120);
    const x = h.x * W + Math.sin(lt * 1.2 + h.ph * 6) * 30;
    heart(x, y, h.s, Math.sin(f * Math.PI) * .75, h.c);
  });
}
function sparkles(lt) {
  SPARKS.forEach(p => {
    const f = ((lt * p.sp + p.ph) % 1 + 1) % 1;
    const a = (.5 + .5 * Math.sin(lt * 3 + p.tw)) * Math.sin(f * Math.PI);
    g.globalAlpha = clamp(a);
    g.fillStyle = "#fff3c4";
    g.beginPath(); g.arc(p.x * W, H * (1 - f), p.s, 0, TAU); g.fill();
  });
  g.globalAlpha = 1;
}
function txt(s, x, y, font, color, a, shadow) {
  g.save();
  g.globalAlpha = a; g.font = font; g.fillStyle = color;
  g.textAlign = "center"; g.textBaseline = "middle";
  if (shadow) { g.shadowColor = shadow; g.shadowBlur = 30; }
  g.fillText(s, x, y);
  g.restore();
}
function goldGrad() {
  const gold = g.createLinearGradient(0, H * .3, 0, H * .6);
  gold.addColorStop(0, "#f8e3a4"); gold.addColorStop(.5, "#d4a85a"); gold.addColorStop(1, "#f3d48c");
  return gold;
}
// نص يتكبر بنعومة عند الدخول
function popText(s, y, font, color, a, lt, startAt, shadow) {
  const sc = lerp(.85, 1, easeOut(prog(lt, startAt, 1.4)));
  g.save();
  g.translate(W / 2, y); g.scale(sc, sc); g.translate(-W / 2, -y);
  txt(s, W / 2, y, font, color, a, shadow);
  g.restore();
}

/* ================= الرسم حسب المشهد ================= */
function draw(lt) {
  background(lt);
  bokeh(lt);
  FLOWERS.forEach(f => flower(f, lt));
  hearts(lt);
  sparkles(lt);

  const ROSE = "#7a4a55", SOFT = "#9a6470", SHADOW = "rgba(255,255,255,.6)";
  const [A, B, C, D, E, F, G] = SCENES.map(sc => win(lt, sc.s, sc.e));
  const L = i => lt - SCENES[i].s;

  // 1: البشارة
  if (A > 0) {
    const y = lerp(30, 0, easeOut(prog(L(0), 0, 1.2)));
    txt("جاتنا البشارة", W / 2, H * .36 + y, "900 110px Cairo", ROSE, A, SHADOW);
    txt("يا هلا بشارة الخير", W / 2, H * .46 + y, "700 60px Cairo", SOFT, A, SHADOW);
  }
  // 2: اسم ليان
  if (B > 0) {
    popText("ليان", H * .44, "900 300px Cairo", goldGrad(), B, L(1), 0, "rgba(190,130,60,.45)");
    txt("المولودة الجديدة", W / 2, H * .56, "500 52px Cairo", "#8a5a4a", B, SHADOW);
  }
  // 3: النور الصغير
  if (C > 0) {
    txt("أهلًا بالنور الصغير", W / 2, H * .4, "900 92px Cairo", ROSE, C, SHADOW);
    txt("نوّرتِ البيت يا ليان", W / 2, H * .49, "700 60px Cairo", SOFT, C, SHADOW);
  }
  // 4: الفرح
  if (D > 0) {
    txt("الفرح يملأ البيت", W / 2, H * .4, "900 96px Cairo", ROSE, D, SHADOW);
    txt("والضحكة تعم المكان", W / 2, H * .49, "700 60px Cairo", SOFT, D, SHADOW);
  }
  // 5: الدعاء
  if (E > 0) {
    txt("اللهم أنبتها نباتاً حسناً", W / 2, H * .4, "700 64px Cairo", ROSE, E, SHADOW);
    txt("واجعلها قرة عين لوالديها", W / 2, H * .47, "700 64px Cairo", ROSE, E, SHADOW);
  }
  // 6: التبريك
  if (F > 0) {
    txt("بارك الله لكم", W / 2, H * .4, "900 96px Cairo", ROSE, F, SHADOW);
    txt("في مولودتكم الغالية", W / 2, H * .5, "700 62px Cairo", SOFT, F, SHADOW);
  }
  // 7: الختام
  if (G > 0) {
    popText("ليان", H * .38, "900 240px Cairo", goldGrad(), G, L(6), 0, "rgba(190,130,60,.45)");
    txt("مبروك", W / 2, H * .55, "900 110px Cairo", ROSE, G, SHADOW);
    txt("نسأل الله لها عمرًا سعيدًا", W / 2, H * .64, "500 50px Cairo", SOFT, G, SHADOW);
  }

  // تدرج خفيف على الحواف
  const vg = g.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .8);
  vg.addColorStop(0, "rgba(255,255,255,0)"); vg.addColorStop(1, "rgba(120,70,80,.18)");
  g.fillStyle = vg; g.fillRect(0, 0, W, H);

  // شريط تقدم ذهبي خفيف
  g.save();
  g.fillStyle = "rgba(255,255,255,.35)"; g.fillRect(0, H - 8, W, 8);
  g.fillStyle = "#d4a85a"; g.fillRect(0, H - 8, W * clamp(lt / DUR), 8);
  g.restore();
}

/* ================= الصوت (مُولّد داخل الصفحة) ================= */
let ac = null, t0 = 0, mdest = null;
function startAudio() {
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { ac = null; return; }
  const now = ac.currentTime + .05;
  t0 = now;

  const master = ac.createGain(); master.gain.value = .5;
  const comp = ac.createDynamicsCompressor();
  master.connect(comp); comp.connect(ac.destination);
  // نفس الصوت يُوجَّه إلى مسار التسجيل أيضًا
  mdest = ac.createMediaStreamDestination();
  master.connect(mdest);

  // صدى ناعم
  const delay = ac.createDelay(); delay.delayTime.value = .28;
  const fb = ac.createGain(); fb.gain.value = .35;
  const wet = ac.createGain(); wet.gain.value = .28;
  delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);

  // نغمة واحدة: مظروف بسيط (هجوم وتلاشٍ)
  const tone = (freq, start, dur, type, vol, attack = .012) => {
    const o = ac.createOscillator(), gn = ac.createGain();
    o.type = type; o.frequency.value = freq;
    const s = now + start;
    gn.gain.setValueAtTime(0, s);
    gn.gain.linearRampToValueAtTime(vol, s + attack);
    gn.gain.exponentialRampToValueAtTime(.0001, s + dur);
    o.connect(gn); gn.connect(master); gn.connect(delay);
    o.start(s); o.stop(s + dur + .05);
  };

  SCENES.forEach((sc, i) => {
    const d = sc.e - sc.s;
    // وسادة ناعمة بالأكورد
    sc.chord.forEach((f, j) => tone(f, sc.s, d + 1, "sine", .045 - j * .008, .8));
    // قيثارة: أربيج خفيف على امتداد المشهد
    const notes = [sc.chord[0], sc.chord[1], sc.chord[2], sc.chord[0] * 2, sc.chord[1] * 2, sc.chord[2] * 2];
    for (let k = 0, time = sc.s + .4; time < sc.e - .6; k++, time += .24) {
      tone(notes[k % notes.length], time, 1.8, "triangle", .1);
    }
    // جرس البداية لبعض المشاهد
    if (sc.chime) {
      tone(sc.chord[2] * 2, sc.s, 2.6, "sine", .14);
      tone(sc.chord[1] * 2, sc.s + .12, 2.4, "sine", .09);
    }
    // لمعان خفيف في نهاية كل مشهد
    if (i % 2 === 1) tone(2400 + (i % 3) * 300, sc.e - .8, .3, "sine", .04);
  });

  // ختام: لمعان ثم تلاشٍ
  for (let i = 0; i < 6; i++) tone(2600 + i * 200, 56 + i * .25, .3, "sine", .045);
  master.gain.setValueAtTime(.5, now + 56.5);
  master.gain.linearRampToValueAtTime(0, now + DUR);
}

/* ================= الحلقة والتحكم ================= */
let lt = 0, playing = false;
function loop() {
  if (playing) {
    lt = ac ? ac.currentTime - t0 : lt;
    if (lt >= DUR) {
      lt = DUR; playing = false;
      btn.textContent = "↺ إعادة التشغيل";
      btn.disabled = false;
      if (recorder && recorder.state !== "inactive") recorder.stop();
    }
  }
  draw(clamp(lt, 0, DUR));
  requestAnimationFrame(loop);
}

btn.onclick = () => {
  if (ac) { try { ac.close(); } catch (e) {} }
  startAudio();
  playing = true;
  btn.textContent = "جارٍ التشغيل…";
  btn.disabled = true;
  if (!ac) { // بدون صوت: تشغيل بالزمن الحقيقي
    const p0 = performance.now();
    const tick = () => {
      if (!playing) return;
      lt = (performance.now() - p0) / 1000;
      if (lt < DUR) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
};

// ===== تصدير الفيديو: الصورة والصوت معًا، MP4 إن كان مدعومًا وإلا WebM =====
const MIMES = ["video/mp4", "video/webm;codecs=vp9", "video/webm"];
const MIME = window.MediaRecorder ? MIMES.find(m => MediaRecorder.isTypeSupported(m)) : null;
const expBtn = document.getElementById("exp");
const note = document.getElementById("note");
let recorder = null;

function startExport() {
  if (!MIME || recorder) return;
  if (ac) { try { ac.close(); } catch (e) {} }
  startAudio();
  if (!ac) { note.textContent = "هذا المتصفح لا يدعم الصوت المطلوب للتصدير"; return; }

  const stream = cv.captureStream(30);
  if (mdest) mdest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
  const type = MIME.split(";")[0];
  const ext = type === "video/mp4" ? "mp4" : "webm";
  const chunks = [];
  recorder = new MediaRecorder(stream, { mimeType: MIME, videoBitsPerSecond: 8000000, audioBitsPerSecond: 192000 });
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "layan-60s." + ext;
    a.textContent = "⬇ تنزيل الفيديو (" + ext.toUpperCase() + "، " + (blob.size / 1048576).toFixed(1) + " MB)";
    note.textContent = "";
    note.appendChild(a);
    stream.getTracks().forEach(tr => tr.stop());
    recorder = null;
    expBtn.disabled = false;
  };
  lt = 0; playing = true;
  btn.disabled = true; expBtn.disabled = true;
  btn.textContent = "جارٍ التصدير…";
  note.textContent = "جارٍ تسجيل الدقيقة كاملة…";
  recorder.start(250);
  setTimeout(() => { if (recorder && recorder.state !== "inactive") recorder.stop(); }, (DUR + 2) * 1000);
}
expBtn.onclick = startExport;

draw(0);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
